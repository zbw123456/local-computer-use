name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: node --check localcu/static/app.js
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build-native.sh
      - name: Native JSONL smoke test (no permissions requested)
        run: python3 scripts/smoke-native.py
